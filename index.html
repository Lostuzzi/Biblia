<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Al Detalle Lavadero – Pedí tu turno</title>
<style>
*{box-sizing:border-box;margin:0}
body{background:#000;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:480px;margin:auto;min-height:100vh;padding:28px 20px;display:flex;flex-direction:column;justify-content:center;gap:28px}
.logo{text-align:center}
.logo img{width:78%;max-width:340px;height:auto}
.logo .txt{font-size:44px;font-weight:900;font-style:italic;letter-spacing:-1px;line-height:1}
.logo .txt span{color:#ffd400}
.logo small{display:block;margin-top:8px;color:#aaa;font-size:14px}
form{display:flex;flex-direction:column;gap:14px}
label{font-weight:700;font-size:15px}
input{width:100%;padding:16px;border-radius:14px;border:2px solid #2a2a30;background:#16161a;color:#fff;font-size:17px;margin-top:6px}
input:focus{outline:none;border-color:#ffd400}
.tipo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.tipo button{padding:18px 8px;border-radius:14px;border:2px solid #2a2a30;background:#16161a;color:#fff;font-size:17px;font-weight:700}
.tipo button.on{background:#ffd400;color:#111;border-color:#ffd400}
.go{padding:18px;border:0;border-radius:14px;background:#ffd400;color:#111;font-size:19px;font-weight:900;font-style:italic;margin-top:6px}
.err{color:#ff6b6b;font-size:14px;min-height:18px}
</style>

<form id="f" autocomplete="off">
  <div>
    <label for="nombre">Tu nombre</label>
    <input id="nombre" placeholder="Ej: Juan Pérez" maxlength="40">
  </div>
  <div>
    <label>¿Qué vehículo tenés?</label>
    <div class="tipo">
      <button type="button" data-t="auto">🚗 Auto</button>
      <button type="button" data-t="moto">🏍️ Moto</button>
    </div>
  </div>
  <div>
    <label for="modelo">Modelo</label>
    <input id="modelo" placeholder="Ej: Volkswagen Vento" maxlength="40">
  </div>
  <div class="err" id="err"></div>
  <button class="go" type="submit">Ver servicios</button>
</form>

<script>
window.addEventListener('error', e => { const d = document.createElement('div'); d.style.cssText = 'background:#900;color:#fff;padding:10px;font-size:13px;margin:8px 0'; d.textContent = 'Error: ' + e.message; document.body.prepend(d); });
const S = {
  g(k) { try { const v = localStorage.getItem(k); if (v !== null) return v; } catch (e) {} try { const o = JSON.parse(window.name || '{}'); return o[k] === undefined ? null : o[k]; } catch (e) { return null; } },
  s(k, v) { try { localStorage.setItem(k, v); } catch (e) {} try { let o; try { o = JSON.parse(window.name || '{}'); } catch (e) { o = {}; } o[k] = v; window.name = JSON.stringify(o); } catch (e) {} },
  r(k) { try { localStorage.removeItem(k); } catch (e) {} try { const o = JSON.parse(window.name || '{}'); delete o[k]; window.name = JSON.stringify(o); } catch (e) {} }
};
let tipo = null;
const prev = JSON.parse(S.g('cw_cliente') || 'null');
const $ = id => document.getElementById(id);
const marcar = t => {
  tipo = t;
  document.querySelectorAll('.tipo button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
};
document.querySelectorAll('.tipo button').forEach(b => b.onclick = () => marcar(b.dataset.t));
if (prev) { $('nombre').value = prev.nombre; $('modelo').value = prev.modelo; marcar(prev.tipo); }

$('f').onsubmit = e => {
  e.preventDefault();
  const nombre = $('nombre').value.trim(), modelo = $('modelo').value.trim();
  if (!nombre || !tipo || !modelo) { $('err').textContent = 'Completá tu nombre, elegí auto o moto y escribí el modelo.'; return; }
  S.s('cw_cliente', JSON.stringify({ nombre, tipo, modelo }));
  S.r('cw_servicio');
  location.href = 'servicios.html?c=' + encodeURIComponent(JSON.stringify({ nombre, tipo, modelo }));
};
</script>
