<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stock Visión</title>
<style>
:root{--bg:#f1f5f9;--card:#fff;--tx:#0f172a;--mu:#64748b;--bd:#e2e8f0;--pr:#2563eb;--ok:#16a34a;--bad:#dc2626;--sb:#111c2d;--in:#f8fafc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1220;--card:#131c2e;--tx:#e5e7eb;--mu:#94a3b8;--bd:#24304a;--in:#0f1727}}
:root[data-theme=dark]{--bg:#0b1220;--card:#131c2e;--tx:#e5e7eb;--mu:#94a3b8;--bd:#24304a;--in:#0f1727}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:"Segoe UI",Roboto,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:15px}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
#app{display:flex;height:100%}
aside{width:260px;background:var(--sb);color:#cbd5e1;display:flex;flex-direction:column;padding:24px 14px;flex:none}
.logo{display:flex;align-items:center;gap:10px;font-size:26px;font-weight:700;color:#fff;margin:0 8px 36px}
.logo i{display:flex;gap:3px;height:30px;align-items:stretch}.logo i b{width:4px;background:#3b82f6;border-radius:2px}.logo i b:nth-child(2n){background:#fff}
.logo span{color:#3b82f6}
nav button{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;margin-bottom:8px;border:0;border-radius:10px;background:none;color:#cbd5e1;font-size:16px;text-align:left}
nav button:hover{background:#1c2a42}nav button.on{background:#2f80ff;color:#fff}
nav button span{font-size:20px;width:24px;text-align:center}
.online{margin-top:auto;border-top:1px solid #243049;padding:18px 8px 0;font-size:14px}
.online b{display:inline-block;width:10px;height:10px;border-radius:50%;background:#22c55e;margin-right:10px}
.online small{display:block;margin:4px 0 0 20px;color:#94a3b8}
main{flex:1;display:flex;flex-direction:column;min-width:0}
header{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 36px;border-bottom:1px solid var(--bd);flex:none}
.store{font-size:17px}.clock{text-align:right;line-height:1.2}.clock b{font-size:18px;display:block}.clock small{color:var(--mu)}
.view{flex:1;overflow:auto;padding:24px}.view[hidden]{display:none}
.card{background:var(--card);border-radius:14px;padding:22px;box-shadow:0 1px 3px rgba(15,23,42,.06)}
h2,h3{margin:0}
#v-scan{display:grid;grid-template-columns:1fr 440px;gap:24px;min-height:0}
.scan{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;min-height:560px}
.frame{width:180px;height:140px;position:relative;margin-bottom:10px;display:flex;justify-content:center;align-items:center;gap:6px}
.frame:before,.frame:after{content:"";position:absolute;width:36px;height:36px;border:5px solid #3b82f6}
.frame:before{left:0;top:0;border-right:0;border-bottom:0;border-radius:10px 0 0 0;box-shadow:0 100px 0 -0px transparent}
.frame:after{right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 10px 0}
.frame b{width:6px;background:#475569;height:70px;border-radius:2px}.frame b:nth-child(2n){width:3px;height:70px}
.scan h1{margin:0;font-size:40px}.scan p{margin:0;color:var(--mu);font-size:17px}
.bar{display:flex;width:min(640px,100%);margin-top:30px;position:relative}
.bar input{flex:1;padding:18px 18px;border:1px solid var(--bd);border-right:0;border-radius:10px 0 0 10px;background:var(--in);font-size:17px;outline:none}
.bar input:focus{border-color:var(--pr)}
.bar button{width:70px;border:0;background:var(--pr);color:#fff;font-size:26px;border-radius:0 10px 10px 0}
.side{display:flex;flex-direction:column;gap:24px}
.row{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--bd);cursor:pointer}
.row:last-child{border:0}.em{width:52px;height:52px;border-radius:10px;background:var(--in);display:flex;align-items:center;justify-content:center;font-size:30px;flex:none}
.row .n{flex:1;min-width:0}.row .n small{display:block;color:var(--mu);font-size:13px}.row b{font-size:17px}
.cart{flex:1;display:flex;flex-direction:column;min-height:260px}
.cart .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.link{background:none;border:0;color:var(--mu)}
.list{flex:1;overflow:auto;max-height:300px}
.empty{color:var(--mu);text-align:center;padding:28px 0;font-size:15px}.empty div{font-size:44px}
.qty{display:flex;align-items:center;gap:6px}.qty button{width:28px;height:28px;border:1px solid var(--bd);background:var(--in);border-radius:6px}
.tot{display:flex;justify-content:space-between;font-size:20px;font-weight:700;padding:12px 0}
.btn{border:0;border-radius:10px;padding:16px;font-weight:600;font-size:17px;background:var(--pr);color:#fff;width:100%}
.btn.ok,.ok{background:var(--ok);color:#fff}.btn:disabled,.ok:disabled{opacity:.4;cursor:not-allowed}
.ghost{background:var(--in);border:1px solid var(--bd);border-radius:10px;padding:14px 22px}
.tb{display:flex;gap:12px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.tb input,.fld input{padding:12px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--in);outline:none;min-width:0}
.tb input{flex:1;min-width:220px}.tb .btn{width:auto;padding:12px 20px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:18px}
.kp .card b{display:block;font-size:26px;margin-top:4px}.kp small{color:var(--mu)}
table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--mu);font-weight:500;font-size:13px;padding:8px 10px;border-bottom:1px solid var(--bd)}
td{padding:10px;border-bottom:1px solid var(--bd)}td.r,th.r{text-align:right}
.tag{padding:3px 10px;border-radius:99px;font-size:12px;background:#fee2e2;color:#b91c1c}.tag.w{background:#fef3c7;color:#92400e}
.g2{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;margin-bottom:18px}
.bars{display:flex;align-items:flex-end;gap:12px;height:170px;margin-top:14px}
.bars div{flex:1;text-align:center;font-size:12px;color:var(--mu);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bars i{display:block;background:var(--pr);border-radius:6px 6px 0 0;min-height:2px;margin-bottom:6px}
.mrow{margin:12px 0}.mrow>div{display:flex;justify-content:space-between}.mrow i{display:block;height:6px;border-radius:4px;background:var(--pr);margin-top:6px}
.gate{max-width:380px;margin:80px auto;text-align:center}.gate input{width:100%;padding:14px;margin:16px 0 10px;border:1px solid var(--bd);border-radius:10px;background:var(--in);font-size:17px;text-align:center}
.err{color:var(--bad);min-height:20px;font-size:14px}
#modal{position:fixed;inset:0;background:rgba(2,6,23,.6);display:none;align-items:center;justify-content:center;z-index:10}
#modal.on{display:flex}#mb{background:var(--card);border-radius:16px;padding:28px;width:min(560px,94vw);max-height:92vh;overflow:auto;animation:pop .15s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.due{text-align:center;background:var(--in);border-radius:12px;padding:16px;margin:16px 0}.due span{color:var(--mu);display:block}.due b{font-size:44px;display:block}.due small{color:var(--mu)}
.pm{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pm button{padding:14px;border:2px solid var(--bd);background:var(--in);border-radius:12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.pm button small{color:var(--mu)}.pm button.on{border-color:var(--pr);background:rgba(37,99,235,.1)}
.sub{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sub button{padding:10px 14px;border:1px solid var(--bd);background:var(--in);border-radius:10px}.sub button.on{border-color:var(--pr);background:rgba(37,99,235,.1)}
.sub input{flex:1;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--in);font-size:18px;min-width:140px}
#chg{width:100%;font-size:18px;text-align:center;padding:6px}
.chk{display:flex;gap:10px;align-items:center;margin:18px 0;font-size:16px}.chk input{width:20px;height:20px}
.act{display:flex;gap:10px;justify-content:flex-end}.act .ok{flex:1;border:0;border-radius:10px;padding:16px;font-weight:600;font-size:17px}
.fld{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}.fld label{display:flex;flex-direction:column;gap:5px;color:var(--mu);font-size:13px}.fld input{color:var(--tx);font-size:15px}
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:14px 22px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:20}
#toast.on{opacity:1}#toast.bad{background:var(--bad)}
#ticket{display:none}
.rm.stop{border-left-color:var(--bad)}
.scan{position:relative}.cc{position:absolute;top:16px;right:16px;padding:10px 16px}
#sg{display:none;position:absolute;left:0;right:0;top:100%;margin-top:6px;background:var(--card);border:1px solid var(--bd);border-radius:12px;box-shadow:0 12px 32px rgba(2,6,23,.28);z-index:5;max-height:320px;overflow:auto;text-align:left}
.sg-i{display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer}.sg-i.on,.sg-i:hover{background:var(--in)}.sg-i .em{width:38px;height:38px;font-size:22px}.sg-i b{font-size:16px}
.so{display:block}
.ft summary{display:flex;align-items:center;gap:10px;padding:9px 6px;cursor:pointer;border-radius:8px;list-style:none}.ft summary::-webkit-details-marker{display:none}.ft summary span{flex:1}.ft summary small{color:var(--mu)}.ft summary:hover,.ff:hover{background:var(--in)}.ft details details{margin-left:22px}
.ff{display:flex;align-items:center;gap:10px;padding:7px 8px 7px 30px;border-radius:8px;font:14px ui-monospace,Consolas,monospace;cursor:pointer}.ff .fn{color:var(--tx)}.ff .fn:hover{color:var(--pr);text-decoration:underline}.ff .fm{flex:1;color:var(--mu);font-size:13px}.ff b{font:inherit;font-weight:600}.ft input[type=checkbox]{width:18px;height:18px;flex:none}
.tk{font:13px ui-monospace,Consolas,monospace;background:#fff;color:#000;padding:16px;border-radius:8px;max-height:55vh;overflow:auto;margin-top:12px}.tk td{padding:1px 0;border:0}
.fld select{padding:12px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--in);color:var(--tx);font-size:15px;outline:none;min-width:0}
.eg{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}.eg button{font-size:22px;padding:4px 0;border:2px solid var(--bd);background:var(--in);border-radius:8px;line-height:1.3}.eg button:hover{border-color:var(--mu)}.eg button.on{border-color:var(--pr);background:rgba(37,99,235,.15)}
.pie{display:flex;gap:26px;align-items:center;flex-wrap:wrap}.pc{width:170px;height:170px;border-radius:50%;flex:none}.lg{flex:1;min-width:200px}.lg div{display:flex;align-items:center;gap:8px;padding:5px 0}.lg i{width:12px;height:12px;border-radius:3px;flex:none}.lg span{flex:1}.lg small{color:var(--mu);width:40px;text-align:right}
.tag.s{background:rgba(37,99,235,.12);color:var(--pr)}
#rem{position:fixed;right:22px;bottom:22px;display:flex;flex-direction:column;gap:12px;z-index:25;width:340px;max-width:92vw}.rm{background:var(--card);border-left:5px solid var(--pr);border-radius:12px;padding:14px 16px;box-shadow:0 8px 28px rgba(2,6,23,.3);animation:pop .2s ease-out}.rm .h{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:2px}.rm .h button{background:none;border:0;font-size:18px;color:var(--mu)}.rm .l{display:flex;justify-content:space-between;padding:4px 0;font-size:14px}.rm small{color:var(--mu);display:block}
#auth{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:30;overflow:auto}#auth .card{width:min(440px,92vw)}#auth h2{margin-bottom:6px}#auth p{color:var(--mu);margin:0 0 14px;font-size:14px}
#auth input[type=text],#auth input[type=password]{width:100%;padding:13px;margin:6px 0;border:1px solid var(--bd);border-radius:10px;background:var(--in);font-size:16px;outline:none}#auth input:focus{border-color:var(--pr)}
.ax{display:flex;gap:10px;margin-top:12px}.ax .btn,.ax .ghost{flex:1}.sync{font-size:13px;margin:6px 0 0 20px;color:#94a3b8}.so{background:none;border:0;color:#94a3b8;margin:8px 0 0 20px;padding:0;text-decoration:underline;font-size:13px}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start;max-width:1100px}.cg p{color:var(--mu);margin:4px 0 0;font-size:14px}.cg small{color:var(--mu)}
@media print{body>*:not(#ticket){display:none!important}#ticket{display:block;width:76mm;font:12px monospace;color:#000;background:#fff}#ticket td{border:0;padding:1px 0}#ticket hr{border:0;border-top:1px dashed #000}}
</style></head><body>
<div id="app">
<aside>
 <div class="logo"><i><b></b><b></b><b></b><b></b><b></b></i>Stock <span>Visión</span></div>
 <nav>
  <button data-v="scan" class="on" onclick="go('scan')"><span>▥</span>Escanear</button>
  <button data-v="prod" onclick="go('prod')"><span>📦</span>Productos</button>
  <button data-v="rep" onclick="go('rep')"><span>📄</span>Reportes</button>
  <button data-v="cfg" onclick="go('cfg')"><span>⚙️</span>Configuración</button>
 </nav>
 <div class="online"><b></b>Sistema en línea<small id="us">Kiosco 1</small><button class="so" onclick="go('fac')">🗂️ Facturas</button><button class="so" onclick="logout()">Cerrar sesión</button></div>
</aside>
<main>
 <header><div class="store">🏪 &nbsp;<span id="sn">Kiosco Principal</span></div><div class="clock"><b id="hm"></b><small id="dt"></small></div></header>

 <section class="view" id="v-scan">
  <div class="card scan"><button class="ghost cc" onclick="ccForm()">🧾 Cerrar caja</button>
   <div class="frame"><b></b><b></b><b></b><b></b><b></b></div>
   <h1>Escaneá el producto</h1>
   <p>Apuntá el código de barras con el lector<br>o escribí el nombre del producto</p>
   <div class="bar"><input id="code" placeholder="Código de barras o nombre del producto..." autocomplete="off"><button onclick="goS()">→</button><div id="sg"></div></div>
  </div>
  <div class="side">
   <div class="card"><h3>Últimos productos</h3><div id="recent"></div></div>
   <div class="card cart">
    <div class="hd"><h3 id="ct">Carrito (0)</h3><button class="link" onclick="cart=[];render()">🗑 Vaciar</button></div>
    <div class="list" id="cl"></div>
    <div class="tot"><span>Total</span><span id="sub">$0</span></div>
    <button class="btn ok" onclick="openPay()">🛒 &nbsp;Finalizar compra</button>
   </div>
  </div>
 </section>

 <section class="view" id="v-prod" hidden>
  <div class="kp" id="pk"></div>
  <div class="card" style="margin-bottom:18px"><h3>Stock por sección</h3><div id="pp" style="margin-top:12px"></div></div>
  <div class="tb"><input id="q" placeholder="Buscar por nombre o código..." oninput="renderProd()"><select id="qs" class="ghost" onchange="renderProd()"></select><button class="ghost" onclick="secForm()">🏷️ Secciones</button><button class="btn" onclick="editP()">+ Nuevo producto</button></div>
  <div class="card"><table><thead><tr><th></th><th>Producto</th><th>Código</th><th>Sección</th><th class="r">Precio</th><th class="r">Stock</th><th></th></tr></thead><tbody id="pt"></tbody></table></div>
 </section>

 <section class="view" id="v-rep" hidden></section>
 <section class="view" id="v-cfg" hidden></section>
 <section class="view" id="v-fac" hidden></section>
</main>
</div>
<div id="modal"><div id="mb"></div></div>
<div id="toast"></div>
<div id="rem"></div>
<div id="auth"></div>
<div id="ticket"></div>

<script>
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const fmt=n=>'$'+Math.round(n).toLocaleString('es-AR');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* ---- Almacenamiento local (navegador de esta PC) ---- */
let DB={};
const lsg=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},lss=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast('No se pudo guardar en este navegador',1)}};
const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a))),unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const ukey=u=>'sv_u_'+u.toLowerCase();
async function hash(pw,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);return b64(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:unb64(salt),iterations:150000},k,256))}
const newSalt=()=>b64(crypto.getRandomValues(new Uint8Array(16)));
const sv=(k,v)=>{DB[k]=v;lss(ukey(DB.user),DB)};
const SEED=[
 {code:'7790895001234',name:'Coca Cola 500ml',price:1100,stock:48,emoji:'🥤',sec:'Bebidas'},
 {code:'7791234005678',name:"Papas Lay's",price:950,stock:30,emoji:'🍟',sec:'Snacks'},
 {code:'7790112345678',name:'Oreo',price:1350,stock:25,emoji:'🍪',sec:'Golosinas'},
 {code:'7790100100012',name:'Kit Kat',price:1250,stock:18,emoji:'🍫',sec:'Golosinas'},
 {code:'7790000000011',name:'Agua mineral 500ml',price:800,stock:60,emoji:'💧',sec:'Bebidas'},
 {code:'7790000000028',name:'Alfajor triple',price:900,stock:4,emoji:'🧁',sec:'Golosinas'}];
let P=[],S=[],SEC=[];
const DEF={name:'Kiosco Principal',addr:'',cuit:'',tel:'',foot:'¡Gracias por su compra!',rQr:10,rDeb:10,r1:10,r3:21,r6:30,r12:30,low:5,inv:false,remD:true,remW:true,remM:true,snd:true};
let CFG={...DEF};
let cart=[],recent=[],view='scan',pay=null,unlocked=false,period='7',modalOpen=false;

function go(v){view=v;$$('.view').forEach(e=>e.hidden=e.id!=='v-'+v);$$('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));render();if(v==='scan')$('#code').focus()}
function toast(t,bad){const e=$('#toast');e.textContent=t;e.className='on'+(bad?' bad':'');clearTimeout(toast.t);toast.t=setTimeout(()=>e.className='',2200)}
function modal(h){$('#mb').innerHTML=h;$('#modal').classList.add('on');modalOpen=true}
function closeModal(){$('#modal').classList.remove('on');modalOpen=false;if(view==='scan')$('#code').focus()}
const items=()=>cart.map(c=>({...P.find(p=>p.code===c.code),qty:c.qty})).filter(i=>i.name);
const subtotal=()=>items().reduce((a,i)=>a+i.price*i.qty,0);

/* ---- Escanear ---- */
function scan(code){
 code=(code||'').trim();$('#code').value='';if(!code)return;
 const p=P.find(x=>x.code===code);
 if(!p)return toast(/[^\d\s]/.test(code)?'No encontré "'+code+'". Probá con otro nombre.':'Código '+code+' no encontrado. Cargalo en Productos.',1);
 const c=cart.find(x=>x.code===code),q=(c?c.qty:0)+1;
 if(q>p.stock)return toast('Sin stock suficiente de '+p.name,1);
 c?c.qty++:cart.push({code,qty:1});
 recent=[code,...recent.filter(x=>x!==code)].slice(0,4);render();
}
let sg=[],sIdx=0;
const norm=t=>t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function sugg(){
 const v=$('#code').value.trim(),box=$('#sg');
 if(!/[^\d\s]/.test(v)){sg=[];box.style.display='none';return}
 const q=norm(v).split(/\s+/);
 sg=P.filter(p=>{const n=norm(p.name)+' '+norm(p.sec||'');return q.every(w=>n.includes(w))}).slice(0,8);sIdx=0;
 box.innerHTML=sg.length?sg.map((p,i)=>`<div class="sg-i${i?'':' on'}" onmousedown="event.preventDefault();pickS(${i})"><div class="em">${p.emoji||'📦'}</div><div style="flex:1;min-width:0">${esc(p.name)}<small style="display:block;color:${p.stock?'var(--mu)':'var(--bad)'}">${secOf(p)===SIN?'':esc(secOf(p))+' · '}${p.stock?'Stock '+p.stock:'Sin stock'}</small></div><b>${fmt(p.price)}</b></div>`).join(''):'<div class="sg-i" style="color:var(--mu);cursor:default">No hay productos con ese nombre</div>';
 box.style.display='block'}
function pickS(i){const p=sg[i];if(!p)return;scan(p.code);sugg();$('#code').focus()}
function mvS(d){sIdx=(sIdx+d+sg.length)%sg.length;const r=[...$('#sg').children];r.forEach((e,i)=>e.classList.toggle('on',i===sIdx));r[sIdx].scrollIntoView({block:'nearest'})}
function goS(){$('#sg').style.display==='block'&&sg.length?pickS(sIdx):scan($('#code').value)}
$('#code').addEventListener('input',sugg);
$('#code').addEventListener('focus',sugg);
$('#code').addEventListener('blur',()=>{$('#sg').style.display='none'});
$('#code').addEventListener('keydown',e=>{
 const open=$('#sg').style.display==='block'&&sg.length;
 if(e.key==='ArrowDown'&&open){e.preventDefault();mvS(1)}
 else if(e.key==='ArrowUp'&&open){e.preventDefault();mvS(-1)}

document.addEventListener('keydown',e=>{

function qty(code,d){const c=cart.find(x=>x.code===code),p=P.find(x=>x.code===code);c.qty+=d;if(c.qty>p.stock){c.qty=p.stock;toast('Stock máximo alcanzado',1)}if(c.qty<=0)cart=cart.filter(x=>x!==c);render()}
function renderScan(){
 const list=[...recent.map(c=>P.find(p=>p.code===c)),...P.filter(p=>!recent.includes(p.code))].filter(Boolean).slice(0,4);

}

/* ---- Cobro ---- */
const rate=()=>(pay.m==='qr'?CFG.rQr:pay.m==='debit'?CFG.rDeb:pay.m==='credit'?CFG['r'+pay.n]:0)/100;
const total=()=>subtotal()*(1+rate());
const LBL={transfer:'Transferencia',qr:'QR',debit:'Tarjeta de débito',cash:'Efectivo',credit:'Tarjeta de crédito'};
function openPay(){if(!items().length)return toast('Escaneá al menos un producto',1);pay={m:'transfer',n:1,cash:'',inv:CFG.inv};renderPay()}
function setM(m){pay.m=m;renderPay()}
function renderPay(){
 const r=rate(),pc=v=>v?'+'+v+'%':'Sin recargo',M=[['transfer','🏦','Sin recargo'],['qr','📱',pc(CFG.rQr)],['debit','💳',pc(CFG.rDeb)],['cash','💵','Sin recargo'],['credit','💳','Elegí las cuotas']];
 modal(`<h2>Finalizar venta</h2>
 <div class="due"><span>Total a pagar</span><b>${fmt(total())}</b>${r?`<small>Subtotal ${fmt(subtotal())} + ${Math.round(r*100)}%</small>`:''}</div>
 <div class="pm">${M.map(([k,ic,s])=>`<button class="${pay.m===k?'on':''}" onclick="setM('${k}')"><span>${ic} ${LBL[k]}</span><small>${s}</small></button>`).join('')}</div>
 ${pay.m==='credit'?`<div class="sub">${[1,3,6,12].map(n=>`<button class="${pay.n===n?'on':''}" onclick="pay.n=${n};renderPay()">${n} ${n>1?'cuotas':'cuota'} · ${CFG['r'+n]?'+'+CFG['r'+n]+'%':'sin recargo'}</button>`).join('')}<div style="width:100%;text-align:center;color:var(--mu)">${pay.n} × ${fmt(total()/pay.n)}</div></div>`:''}
 ${pay.m==='cash'?`<div class="sub"><input id="cash" type="number" min="0" placeholder="¿Con cuánto paga el cliente?" value="${pay.cash}" oninput="cashIn()"><button onclick="setCash(${Math.ceil(total())})">Exacto</button>${[5000,10000,20000].map(v=>`<button onclick="setCash(${v})">${fmt(v)}</button>`).join('')}<div id="chg"></div></div>`:''}
 <label class="chk"><input type="checkbox" ${pay.inv?'checked':''} onchange="pay.inv=this.checked"> Imprimir factura</label>
 <div class="act"><button class="ghost" onclick="closeModal()">Cancelar</button><button class="ok" id="conf" onclick="confirmSale()">Confirmar venta</button></div>`);
 if(pay.m==='cash')cashIn();
}
function setCash(v){$('#cash').value=v;cashIn()}
function cashIn(){
 const v=+$('#cash').value||0,t=Math.ceil(total());pay.cash=$('#cash').value;
 $('#chg').innerHTML=v>=t?`Vuelto a devolver: <b style="color:var(--ok)">${fmt(v-total())}</b>`:`Faltan <b style="color:var(--bad)">${fmt(t-v)}</b>`;
 $('#conf').disabled=v<t}
function confirmSale(){
 const it=items(),sub=subtotal(),tot=total(),cash=+pay.cash||0;
 const label=pay.m==='credit'?`Crédito ${pay.n} ${pay.n>1?'cuotas':'cuota'}`:LBL[pay.m];
 const al=[];it.forEach(i=>{const p=P.find(p=>p.code===i.code),was=p.stock<=lim(p);p.stock-=i.qty;if(!was&&p.stock<=lim(p))al.push(p)});
 const sale={id:(S.length?S[S.length-1].id:0)+1,ts:Date.now(),biz:{name:CFG.name,addr:CFG.addr,cuit:CFG.cuit,tel:CFG.tel,foot:CFG.foot},items:it.map(i=>({code:i.code,name:i.name,price:i.price,qty:i.qty,sec:secOf(i)})),sub,total:tot,method:pay.m,label,cash:pay.m==='cash'?cash:0,change:pay.m==='cash'?cash-tot:0};
 S.push(sale);sv('sv_s',S);sv('sv_p',P);
 const inv=pay.inv;cart=[];closeModal();render();toast('Venta registrada · '+fmt(tot));snd('ok');al.forEach(stopCard);
 if(inv)printTicket(sale);
}
function ticketHTML(s){
 const b=s.biz||CFG;
 return `<div style="text-align:center"><b>${esc(b.name.toUpperCase())}</b><br>${[b.addr,b.cuit&&'CUIT '+b.cuit,b.tel&&'Tel '+b.tel].filter(Boolean).map(esc).join('<br>')}<br>${new Date(s.ts).toLocaleString('es-AR')}<br>Comprobante N° ${String(s.id).padStart(6,'0')}</div><hr><table style="width:100%">${s.items.map(i=>`<tr><td>${i.qty} x ${esc(i.name)}</td><td style="text-align:right">${fmt(i.qty*i.price)}</td></tr>`).join('')}</table><hr><table style="width:100%"><tr><td>Subtotal</td><td style="text-align:right">${fmt(s.sub)}</td></tr><tr><td>Recargo</td><td style="text-align:right">${fmt(s.total-s.sub)}</td></tr><tr><td><b>TOTAL</b></td><td style="text-align:right"><b>${fmt(s.total)}</b></td></tr><tr><td>Pago</td><td style="text-align:right">${esc(s.label)}</td></tr>${s.cash?`<tr><td>Recibido</td><td style="text-align:right">${fmt(s.cash)}</td></tr><tr><td>Vuelto</td><td style="text-align:right">${fmt(s.change)}</td></tr>`:''}</table><hr><div style="text-align:center">${esc(b.foot)}</div>`}
function printTickets(l){$('#ticket').innerHTML=l.map(ticketHTML).join('<div style="page-break-after:always;height:1px"></div>');setTimeout(()=>window.print(),80)}
function printTicket(s){printTickets([s])}

/* ---- Secciones, gráfico de torta y recordatorios ---- */
const SIN='Sin sección',COL=['#2563eb','#16a34a','#f59e0b','#dc2626','#8b5cf6','#06b6d4','#ec4899','#84cc16','#f97316','#64748b'];
const secOf=p=>(p&&p.sec&&p.sec.trim())||SIN;
const lim=p=>(p.min===0||p.min>0)?p.min:CFG.low;
const secs=()=>[...SEC].sort((a,b)=>a.localeCompare(b,'es'));
function pie(data,fm){
 data=data.filter(d=>d[1]>0).sort((a,b)=>b[1]-a[1]);const T=data.reduce((a,d)=>a+d[1],0);
 if(!T)return '<div class="empty">Sin datos para mostrar</div>';
 let acc=0;const st=data.map((d,i)=>{const a=acc/T*100;acc+=d[1];return `${COL[i%COL.length]} ${a}% ${acc/T*100}%`}).join(',');
 return `<div class="pie"><div class="pc" style="background:conic-gradient(${st})"></div><div class="lg">${data.map((d,i)=>`<div><i style="background:${COL[i%COL.length]}"></i><span>${esc(d[0])}</span><b>${fm(d[1])}</b><small>${Math.round(d[1]/T*100)}%</small></div>`).join('')}</div></div>`}
const dk=t=>{const d=new Date(t);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const sod=t=>{const d=new Date(t);return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime()};
const mon=t=>{const d=new Date(t);return new Date(d.getFullYear(),d.getMonth(),d.getDate()-((d.getDay()+6)%7)).getTime()};
function topIn(a,b){
 const L=S.filter(s=>s.ts>=a&&s.ts<b),u={},v={};let tot=0;
 L.forEach(s=>{tot+=s.total;s.items.forEach(i=>{u[i.name]=(u[i.name]||0)+i.qty;const k=i.sec||secOf(P.find(p=>p.code===i.code));v[k]=(v[k]||0)+i.qty})});
 return{n:L.length,tot,top:Object.entries(u).sort((x,y)=>y[1]-x[1]).slice(0,3),sec:Object.entries(v).sort((x,y)=>y[1]-x[1])[0]}}
function remCard(ic,title,sub,r){
 const el=document.createElement('div');el.className='rm';
 el.innerHTML=`<div class="h"><span>${ic} ${title}</span><button onclick="this.closest('.rm').remove()">✕</button></div><small>${sub}</small>${r.top.map((t,i)=>`<div class="l"><span>${i+1}. ${esc(t[0])}</span><b>${t[1]} u.</b></div>`).join('')}${r.sec&&r.sec[0]!==SIN?`<small style="margin-top:4px">Sección líder: <b>${esc(r.sec[0])}</b></small>`:''}<small style="margin-top:4px">${r.n} ${r.n===1?'venta':'ventas'} · ${fmt(r.tot)}</small>`;
 $('#rem').appendChild(el)}
function stopCard(p){
 const el=document.createElement('div');el.className='rm stop';
 el.innerHTML=`<div class="h"><span>⚠️ Stop loss: ${esc(p.name)}</span><button onclick="this.closest('.rm').remove()">✕</button></div><small>${p.stock===0?'Se quedó <b>sin stock</b>.':`Quedan <b>${p.stock}</b> unidades.`} Tu stop loss es ${lim(p)}.</small><small style="margin-top:4px">Conviene reponer este producto.</small>`;
 $('#rem').appendChild(el)}
function showRem(){
 const t=Date.now(),n=new Date(t),m=new Date(n.getFullYear(),n.getMonth(),1).getTime();
 [['📅','Hoy','Lo más vendido hoy',sod(t)],['🗓️','Esta semana','Lo más vendido desde el lunes',mon(t)],['📆','Este mes','Lo más vendido en el mes',m]].forEach(([ic,ti,su,a])=>{const r=topIn(a,t+1);remCard(ic,ti,r.top.length?su:'Todavía no hay ventas',r)})}
function checkRem(){
 if(!DB.user)return;
 const t=Date.now(),n=new Date(t),keys={d:dk(t),w:dk(mon(t)),m:n.getFullYear()+'-'+(n.getMonth()+1)},R=DB.sv_rem;
 if(!R){sv('sv_rem',keys);return}
 const out=[];
 if(R.d!==keys.d&&CFG.remD)out.push(['📅','Resumen de ayer','Lo más vendido ayer',new Date(n.getFullYear(),n.getMonth(),n.getDate()-1).getTime(),sod(t)]);
 if(R.w!==keys.w&&CFG.remW){const a=mon(t),b=new Date(new Date(a).getFullYear(),new Date(a).getMonth(),new Date(a).getDate()-7).getTime();out.push(['🗓️','Resumen de la semana pasada','Lo más vendido de lunes a domingo',b,a])}
 if(R.m!==keys.m&&CFG.remM)out.push(['📆','Resumen del mes pasado','Lo más vendido del mes',new Date(n.getFullYear(),n.getMonth()-1,1).getTime(),new Date(n.getFullYear(),n.getMonth(),1).getTime()]);
 out.forEach(([ic,ti,su,a,b])=>{const r=topIn(a,b);if(r.top.length)remCard(ic,ti,su,r)});
 if(R.d!==keys.d||R.w!==keys.w||R.m!==keys.m)sv('sv_rem',keys)}

/* ---- Productos / stock ---- */
function renderProd(){
 const q=($('#q').value||'').toLowerCase(),low=P.filter(p=>p.stock<=lim(p)).length,sel=$('#qs'),prev=sel.value;
 sel.innerHTML='<option value="">Todas las secciones</option>'+[...secs(),...(P.some(p=>secOf(p)===SIN)?[SIN]:[])].map(x=>`<option${x===prev?' selected':''}>${esc(x)}</option>`).join('');
 const qv=sel.value;
 $('#pk').innerHTML=`<div class="card"><small>Productos</small><b>${P.length}</b></div><div class="card"><small>Unidades en stock</small><b>${P.reduce((a,p)=>a+p.stock,0)}</b></div><div class="card"><small>Valor del stock</small><b>${fmt(P.reduce((a,p)=>a+p.stock*p.price,0))}</b></div><div class="card"><small>En stop loss o stock bajo</small><b style="color:${low?'var(--bad)':'inherit'}">${low}</b></div>`;
 $('#pp').innerHTML=pie(Object.entries(P.reduce((m,p)=>(m[secOf(p)]=(m[secOf(p)]||0)+p.stock,m),{})),v=>v+' u.');
 $('#pt').innerHTML=P.filter(p=>(!q||p.name.toLowerCase().includes(q)||p.code.includes(q))&&(!qv||secOf(p)===qv)).map(p=>`<tr><td style="font-size:24px">${p.emoji||'📦'}</td><td>${esc(p.name)}</td><td style="color:var(--mu)">${esc(p.code)}</td><td>${secOf(p)===SIN?'<span style="color:var(--mu)">—</span>':`<span class="tag s">${esc(secOf(p))}</span>`}</td><td class="r">${fmt(p.price)}</td><td class="r">${p.stock} <small style="color:var(--mu)">/ mín. ${lim(p)}</small> ${p.stock===0?'<span class="tag">Sin stock</span>':p.stock<=lim(p)?'<span class="tag w">Stop loss</span>':''}</td><td class="r"><button class="ghost" style="padding:6px 14px" onclick="editP('${p.code}')">Editar</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">No hay productos que coincidan</td></tr>';
}
const EM=['🥤','🍹','💧','☕','🧉','🥛','🍺','🍫','🍬','🍭','🍪','🍩','🧁','🍰','🍦','🍿','🍟','🥨','🥜','🥪','🌭','🍔','🍕','🥐','🍞','🧀','🥚','🍎','🍌','🍇'];
function pickE(e){$('#f-e').value=e;$$('.eg button').forEach(b=>b.classList.toggle('on',b.textContent===e))}
function editP(code){
 const p=P.find(x=>x.code===code)||{code:'',name:'',price:'',stock:'',emoji:'',sec:''},cur=code?(p.emoji||''):'',L=cur&&!EM.includes(cur)?[cur,...EM]:EM;
 modal(`<h2>${code?'Editar producto':'Nuevo producto'}</h2><div class="fld">
 <label style="grid-column:1/3">Nombre<input id="f-n" value="${esc(p.name)}"></label>
 <label>Código de barras<input id="f-c" value="${esc(p.code)}"></label>
 <label>Sección<select id="f-sec"><option value="">Sin sección</option>${secs().map(x=>`<option${x===p.sec?' selected':''}>${esc(x)}</option>`).join('')}</select></label>
 <label>Precio ($)<input id="f-p" type="number" min="0" value="${p.price}"></label><label>Stock<input id="f-s" type="number" min="0" value="${p.stock}"></label>
 <label>Stop loss (avisar al llegar a)<input id="f-m" type="number" min="0" placeholder="Por defecto: ${CFG.low}" value="${p.min??''}"></label><span></span>
 <div style="grid-column:1/3;color:var(--mu);font-size:13px">Ícono (elegí uno)<div class="eg" style="margin-top:6px">${L.map(e=>`<button type="button" class="${e===cur?'on':''}" onclick="pickE('${e}')">${e}</button>`).join('')}</div><input type="hidden" id="f-e" value="${esc(cur)}"></div></div>
 <div class="err" id="fe"></div><div class="act">${code?`<button class="ghost" id="del" onclick="delP('${code}')">Eliminar</button>`:''}<button class="ghost" onclick="closeModal()">Cancelar</button><button class="ok" onclick="saveP('${code||''}')">Guardar</button></div>`);
 setTimeout(()=>$(code?'#f-p':'#f-c').focus(),30);
}
function saveP(old){
 const n=$('#f-n').value.trim(),c=$('#f-c').value.trim(),pr=+$('#f-p').value,st=Math.max(0,parseInt($('#f-s').value)||0);
 if(!n||!c||!(pr>=0)||$('#f-p').value==='')return $('#fe').textContent='Completá nombre, código y precio.';
 if(P.some(x=>x.code===c&&x.code!==old))return $('#fe').textContent='Ya existe un producto con ese código.';
 const sc=$('#f-sec').value;
 const np={code:c,name:n,price:pr,stock:st,emoji:$('#f-e').value.trim()||'📦',sec:sc,min:$('#f-m').value.trim()===''?undefined:Math.max(0,parseInt($('#f-m').value)||0)},i=P.findIndex(x=>x.code===old),o0=P[i],was=o0&&o0.stock<=lim(o0);
 i>=0?P[i]=np:P.push(np);cart=cart.filter(x=>x.code!==old||old===c);sv('sv_p',P);closeModal();render();toast('Producto guardado');if(np.stock<=lim(np)&&!was)stopCard(np)}
function secForm(m=''){
 const cnt=x=>P.filter(p=>p.sec===x).length;
 modal(`<h2>Secciones</h2><p style="color:var(--mu);margin:6px 0 14px;font-size:14px">Creá las secciones acá y después elegilas al cargar cada producto.</p>
 <div class="sub" style="margin:0 0 6px"><input id="s-new" placeholder="Nueva sección (ej: Cigarros)" onkeydown="if(event.key==='Enter')addSec()"><button class="btn" style="width:auto;padding:12px 20px" onclick="addSec()">Agregar</button></div>
 <div class="err" id="fe">${m}</div>
 <div style="max-height:46vh;overflow:auto">${secs().map(x=>`<div class="row" style="cursor:default"><input style="flex:1;min-width:0;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--in)" value="${esc(x)}" data-o="${esc(x)}" onchange="renSec(this)"><small style="color:var(--mu);width:80px;text-align:right">${cnt(x)} prod.</small><button class="ghost" style="padding:8px 12px" data-s="${esc(x)}" onclick="delSec(this)">Eliminar</button></div>`).join('')||'<div class="empty">Todavía no hay secciones</div>'}</div>
 <div class="act" style="margin-top:16px"><button class="ghost" onclick="closeModal()">Cerrar</button></div>`);
 if(!m)setTimeout(()=>$('#s-new').focus(),30)}
function addSec(){const v=$('#s-new').value.trim();if(!v)return;if(SEC.some(x=>x.toLowerCase()===v.toLowerCase()))return secForm('Esa sección ya existe.');SEC.push(v);sv('sv_sec',SEC);render();secForm()}
function renSec(el){const o=el.dataset.o,v=el.value.trim();if(!v||v===o)return secForm();if(SEC.some(x=>x!==o&&x.toLowerCase()===v.toLowerCase()))return secForm('Ya existe una sección con ese nombre.');SEC=SEC.map(x=>x===o?v:x);P.forEach(p=>{if(p.sec===o)p.sec=v});sv('sv_sec',SEC);sv('sv_p',P);render();secForm()}
function delSec(b){const o=b.dataset.s;if(b.dataset.c!=='1'){b.dataset.c='1';b.textContent='¿Seguro?';return}SEC=SEC.filter(x=>x!==o);P.forEach(p=>{if(p.sec===o)p.sec=''});sv('sv_sec',SEC);sv('sv_p',P);render();secForm()}
function delP(code){const b=$('#del');if(b.dataset.s!=='1'){b.dataset.s='1';b.textContent='¿Seguro? Tocá de nuevo';return}
 P=P.filter(p=>p.code!==code);cart=cart.filter(c=>c.code!==code);sv('sv_p',P);closeModal();render();toast('Producto eliminado')}

/* ---- Reportes (admin) ---- */
async function unlock(){const b=$('#pw').value;$('#pe').textContent='Verificando…';if(b&&await hash(b,DB.salt)===DB.hash){unlocked=true;render()}else{$('#pe').textContent='Contraseña incorrecta';$('#pw').select()}}
function renderRep(){
 const el=$('#v-rep');
 if(!unlocked){el.innerHTML=`<div class="card gate"><div style="font-size:40px">🔒</div><h2>Panel de administrador</h2><input id="pw" type="password" placeholder="Contraseña" onkeydown="if(event.key==='Enter')unlock()"><div class="err" id="pe"></div><button class="btn" onclick="unlock()">Ingresar</button></div>`;return $('#pw').focus()}
 const now=new Date(),d0=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime(),DAY=864e5;
 const from=period==='today'?d0:period==='7'?d0-6*DAY:0,L=S.filter(s=>s.ts>=from);
 const T=L.reduce((a,s)=>a+s.total,0),U=L.reduce((a,s)=>a+s.items.reduce((b,i)=>b+i.qty,0),0);
 const days=[...Array(7)].map((_,k)=>{const t=d0-(6-k)*DAY;return{l:new Date(t).toLocaleDateString('es-AR',{weekday:'short'}),v:S.filter(s=>s.ts>=t&&s.ts<t+DAY).reduce((a,s)=>a+s.total,0)}}),mx=Math.max(1,...days.map(d=>d.v));
 const bm={};L.forEach(s=>bm[s.label.split(' ')[0]==='Crédito'?'Tarjeta de crédito':s.label]=(bm[s.label.split(' ')[0]==='Crédito'?'Tarjeta de crédito':s.label]||0)+s.total);
 const tp={};L.forEach(s=>s.items.forEach(i=>tp[i.name]=(tp[i.name]||0)+i.qty));
 const bs={};L.forEach(s=>s.items.forEach(i=>{const k=i.sec||secOf(P.find(p=>p.code===i.code));bs[k]=(bs[k]||0)+i.price*i.qty}));
 const top=Object.entries(tp).sort((a,b)=>b[1]-a[1]).slice(0,5);
 el.innerHTML=`<div class="tb"><h2 style="flex:1">Seguimiento de ventas</h2>
  <select class="ghost" onchange="period=this.value;renderRep()"><option value="today" ${period==='today'?'selected':''}>Hoy</option><option value="7" ${period==='7'?'selected':''}>Últimos 7 días</option><option value="all" ${period==='all'?'selected':''}>Todo</option></select>
  <button class="ghost" onclick="pwForm()">Cambiar contraseña</button><button class="ghost" onclick="showRem()">🔔 Más vendidos</button><button class="ghost" onclick="unlocked=false;renderRep()">🔒 Bloquear</button></div>
  <div class="kp"><div class="card"><small>Ventas</small><b>${fmt(T)}</b></div><div class="card"><small>Operaciones</small><b>${L.length}</b></div><div class="card"><small>Ticket promedio</small><b>${fmt(L.length?T/L.length:0)}</b></div><div class="card"><small>Unidades vendidas</small><b>${U}</b></div></div>
  <div class="g2"><div class="card"><h3>Ventas por día</h3><div class="bars">${days.map(d=>`<div><i style="height:${d.v/mx*120}px" title="${fmt(d.v)}"></i>${d.l}</div>`).join('')}</div></div>
  <div class="card"><h3>Por método de pago</h3>${Object.entries(bm).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="mrow"><div><span>${k}</span><b>${fmt(v)}</b></div><i style="width:${v/T*100}%"></i></div>`).join('')||'<div class="empty">Sin ventas en este período</div>'}</div></div>
  <div class="card" style="margin-bottom:18px"><h3>Ventas por sección</h3><div style="margin-top:12px">${pie(Object.entries(bs),fmt)}</div></div>
  <div class="card" style="margin-bottom:18px"><h3>Cierres de caja</h3><table><thead><tr><th>Cierre</th><th>Ventas</th><th class="r">Efectivo</th><th class="r">Total</th></tr></thead><tbody>${[...(DB.sv_cc||[])].reverse().slice(0,8).map(c=>`<tr><td>${new Date(c.ts).toLocaleString('es-AR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false})}</td><td>${c.n}</td><td class="r">${fmt((c.by['Efectivo']||{t:0}).t)}</td><td class="r"><b>${fmt(c.total)}</b></td></tr>`).join('')||'<tr><td colspan="4" class="empty">Todavía no cerraste ninguna caja</td></tr>'}</tbody></table></div>
  <div class="g2"><div class="card"><h3>Últimas ventas</h3><table><thead><tr><th>N°</th><th>Fecha</th><th>Pago</th><th class="r">Total</th></tr></thead><tbody>${[...L].reverse().slice(0,12).map(s=>`<tr><td>${String(s.id).padStart(4,'0')}</td><td>${new Date(s.ts).toLocaleString('es-AR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</td><td>${s.label}</td><td class="r">${fmt(s.total)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Todavía no hay ventas</td></tr>'}</tbody></table></div>
  <div class="card"><h3>Más vendidos</h3><table><tbody>${top.map(([n,q])=>`<tr><td>${esc(n)}</td><td class="r"><b>${q}</b> u.</td></tr>`).join('')||'<tr><td class="empty">Sin datos</td></tr>'}</tbody></table></div></div>`;
}
function pwForm(){modal(`<h2>Cambiar contraseña</h2><div class="fld"><label style="grid-column:1/3">Contraseña actual<input id="p0" type="password"></label><label style="grid-column:1/3">Nueva contraseña (mín. 6 caracteres)<input id="p1" type="password"></label></div><div class="err" id="fe"></div><div class="act"><button class="ghost" onclick="closeModal()">Cancelar</button><button class="ok" onclick="setPw()">Guardar</button></div>`)}
async function setPw(){if(await hash($('#p0').value,DB.salt)!==DB.hash)return $('#fe').textContent='La contraseña actual no coincide.';if($('#p1').value.length<6)return $('#fe').textContent='La nueva contraseña debe tener al menos 6 caracteres.';DB.salt=newSalt();DB.hash=await hash($('#p1').value,DB.salt);sv('salt',DB.salt);closeModal();toast('Contraseña actualizada')}

/* ---- Cierre de caja ---- */
const CCM=['Efectivo','Transferencia','QR','Tarjeta de débito','Tarjeta de crédito'];
let CCV=null;
function ccData(){
 const t=Date.now(),d0=sod(t),last=(DB.sv_cc||[]).filter(c=>c.ts>=d0).reduce((a,c)=>Math.max(a,c.ts),0),from=Math.max(d0,last);
 const L=S.filter(s=>s.ts>from),by={};
 L.forEach(s=>{const k=s.label.startsWith('Crédito')?'Tarjeta de crédito':s.label;by[k]=by[k]||{n:0,t:0};by[k].n++;by[k].t+=s.total});
 return{from,to:t,n:L.length,total:L.reduce((a,s)=>a+s.total,0),units:L.reduce((a,s)=>a+s.items.reduce((b,i)=>b+i.qty,0),0),by}}
function ccForm(done){
 const c=done||ccData(),fh=t=>new Date(t).toLocaleString('es-AR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
 CCV=c;
 modal(`<h2>${done?'✓ Caja cerrada':'Cerrar caja'}</h2><div class="due"><span>${done?'Total de la caja':'La caja del día va en'}</span><b>${fmt(c.total)}</b><small>${c.n} ${c.n===1?'venta':'ventas'} · ${c.units} u. · ${fh(c.from)} a ${fh(c.to)}</small></div>
 <div>${CCM.map(m=>{const x=c.by[m]||{n:0,t:0};return `<div class="row" style="cursor:default;${x.n?'':'opacity:.45'}"><div class="n">${m}<small>${x.n} ${x.n===1?'venta':'ventas'}</small></div><b>${fmt(x.t)}</b></div>`}).join('')}</div>
 ${done?'':'<p style="color:var(--mu);font-size:13px;margin:12px 0 0">Al cerrar la caja, el próximo cierre cuenta desde este momento.</p>'}
 <div class="act" style="margin-top:16px"><button class="ghost" onclick="closeModal()">${done?'Listo':'Cancelar'}</button><button class="ghost" onclick="printCC()">🖨 Imprimir</button>${done?'':`<button class="ok" ${c.n?'':'disabled'} onclick="doCC()">Cerrar caja</button>`}</div>`)}
function doCC(){
 const c=ccData();if(!c.n)return;
 const cc=DB.sv_cc||[],rec={id:cc.length?Math.max(...cc.map(x=>x.id))+1:1,ts:c.to,from:c.from,to:c.to,n:c.n,total:c.total,units:c.units,by:c.by};
 sv('sv_cc',[...cc,rec]);snd('ok');ccForm(rec)}
function cierreHTML(c){
 const fh=t=>new Date(t).toLocaleString('es-AR'),row=(a,b)=>`<tr><td>${a}</td><td style="text-align:right">${b}</td></tr>`;
 return `<div style="text-align:center"><b>${esc(CFG.name.toUpperCase())}</b><br>CIERRE DE CAJA<br>${fh(c.to)}</div><hr><div>Desde: ${fh(c.from)}<br>Hasta: ${fh(c.to)}</div><hr><table style="width:100%">${CCM.map(m=>{const x=c.by[m]||{n:0,t:0};return row(`${m} (${x.n})`,fmt(x.t))}).join('')}</table><hr><table style="width:100%">${row('Ventas',c.n)}${row('Unidades',c.units)}${row('<b>TOTAL</b>','<b>'+fmt(c.total)+'</b>')}</table>`}
function printHTML(h){$('#ticket').innerHTML=h;setTimeout(()=>window.print(),80)}
function printCC(){if(CCV)printHTML(cierreHTML(CCV))}

/* ---- Facturas (archivo de todas las ventas) ---- */
let fsel=new Set(),fopen=new Set();
const nF=s=>'factura-'+String(s.id).padStart(6,'0')+'.txt';
function renderFac(){
 const el=$('#v-fac');
 if(!unlocked){el.innerHTML=`<div class="card gate"><div style="font-size:40px">🔒</div><h2>Facturas</h2><input id="pw" type="password" placeholder="Contraseña" onkeydown="if(event.key==='Enter')unlock()"><div class="err" id="pe"></div><button class="btn" onclick="unlock()">Ingresar</button></div>`;return $('#pw').focus()}
 const G={},z=n=>String(n).padStart(2,'0');
 [...S].sort((a,b)=>b.ts-a.ts).forEach(s=>{const d=new Date(s.ts),m=d.getFullYear()+'-'+z(d.getMonth()+1),dd=m+'-'+z(d.getDate());G[m]=G[m]||{};(G[m][dd]=G[m][dd]||[]).push(s)});
 const ms=Object.keys(G).sort().reverse();
 if(!fopen.size&&ms.length){fopen.add('m'+ms[0]);fopen.add('d'+Object.keys(G[ms[0]]).sort().reverse()[0])}
 const fm=k=>{const [y,m]=k.split('-'),t=new Date(y,m-1,1).toLocaleDateString('es-AR',{month:'long',year:'numeric'});return t[0].toUpperCase()+t.slice(1)},fd=k=>{const [y,m,d]=k.split('-');return d+'/'+m+'/'+y};
 const row=s=>`<label class="ff"><span>📄</span><a class="fn" onclick="event.preventDefault();verF(${s.id})">${nF(s)}</a><span class="fm">${new Date(s.ts).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',hour12:false})} · ${esc(s.label)}</span><b>${fmt(s.total)}</b><input type="checkbox" class="fc" data-id="${s.id}" ${fsel.has(s.id)?'checked':''} onchange="tgF(this)"></label>`;
 const dir=(k,t,n,inner)=>`<details data-k="${k}" ${fopen.has(k)?'open':''} ontoggle="tgO(this)"><summary><span>📁 ${t}</span><small>${n} ${n===1?'factura':'facturas'}</small><input type="checkbox" class="fg" onchange="tgG(this)"></summary>${inner}</details>`;
 el.innerHTML=`<div class="tb"><h2 style="flex:1">🗂️ Facturas</h2><button class="ghost" onclick="unlocked=false;render()">🔒 Bloquear</button><button class="btn" id="fp" style="width:auto;padding:12px 22px" onclick="printSel()">🖨 Imprimir factura</button></div>
 <div class="card ft">${ms.map(m=>dir('m'+m,fm(m),Object.values(G[m]).reduce((a,l)=>a+l.length,0),Object.keys(G[m]).sort().reverse().map(d=>dir('d'+d,fd(d),G[m][d].length,G[m][d].map(row).join(''))).join(''))).join('')||'<div class="empty">Todavía no hay facturas. Se guardan solas con cada venta.</div>'}</div>`;
 updF()}
function updF(){
 $$('#v-fac details').forEach(d=>{const c=[...d.querySelectorAll('.fc')],g=d.firstElementChild.querySelector('.fg'),n=c.filter(x=>x.checked).length;g.checked=c.length>0&&n===c.length;g.indeterminate=n>0&&n<c.length});
 const n=fsel.size,b=$('#fp');if(!b)return;b.textContent='🖨 Imprimir factura'+(n>1?'s':'')+(n?` (${n})`:'');b.disabled=!n;b.style.opacity=n?1:.4}
function tgF(cb){const id=+cb.dataset.id;cb.checked?fsel.add(id):fsel.delete(id);updF()}
function tgG(g){g.closest('details').querySelectorAll('.fc').forEach(c=>{c.checked=g.checked;const id=+c.dataset.id;g.checked?fsel.add(id):fsel.delete(id)});updF()}
function tgO(d){d.open?fopen.add(d.dataset.k):fopen.delete(d.dataset.k)}
function printSel(){const l=S.filter(s=>fsel.has(s.id)).sort((a,b)=>a.id-b.id);if(l.length)printTickets(l)}
function verF(id){const s=S.find(x=>x.id===id);if(!s)return;modal(`<h2>${nF(s)}</h2><div class="tk">${ticketHTML(s)}</div><div class="act" style="margin-top:16px"><button class="ghost" onclick="closeModal()">Cerrar</button><button class="ok" onclick="closeModal();printTickets([S.find(x=>x.id===${id})])">🖨 Imprimir</button></div>`)}

/* ---- Configuración (admin) ---- */
function renderCfg(){
 const el=$('#v-cfg');
 if(!unlocked){el.innerHTML=`<div class="card gate"><div style="font-size:40px">🔒</div><h2>Configuración</h2><input id="pw" type="password" placeholder="Contraseña de administrador" onkeydown="if(event.key==='Enter')unlock()"><div class="err" id="pe"></div><button class="btn" onclick="unlock()">Ingresar</button></div>`;return $('#pw').focus()}
 const f=(id,l,t,x='')=>`<label ${x}>${l}<input id="c-${id}" type="${t}" value="${esc(CFG[id])}" ${t==='number'?'min="0" step="1"':''}></label>`,w='style="grid-column:1/3"';
 el.innerHTML=`<div class="tb"><h2 style="flex:1">Configuración</h2><button class="ghost" onclick="unlocked=false;render()">🔒 Bloquear</button><button class="btn ok" style="width:auto;padding:12px 22px" onclick="saveCfg()">Guardar cambios</button></div>
 <div class="cg">
 <div class="card"><h3>Datos del negocio</h3><p>Se muestran en el encabezado y en la factura impresa.</p><div class="fld">${f('name','Nombre del negocio','text',w)}${f('addr','Dirección','text',w)}${f('cuit','CUIT','text')}${f('tel','Teléfono','text')}${f('foot','Mensaje al pie de la factura','text',w)}</div></div>
 <div class="card"><h3>Recargos de cobro (%)</h3><p>Se suman al total según el método de pago.</p><div class="fld">${f('rQr','QR','number')}${f('rDeb','Tarjeta de débito','number')}${f('r1','Crédito · 1 cuota','number')}${f('r3','Crédito · 3 cuotas','number')}${f('r6','Crédito · 6 cuotas','number')}${f('r12','Crédito · 12 cuotas','number')}</div><small>Transferencia y efectivo no llevan recargo.</small></div>
 <div class="card"><h3>Ventas y stock</h3><div class="fld">${f('low','Stop loss por defecto (unidades)','number',w)}</div><label class="chk"><input type="checkbox" id="c-inv" ${CFG.inv?'checked':''}> Tildar "Imprimir factura" por defecto</label><label class="chk" style="margin-top:0"><input type="checkbox" id="c-snd" ${CFG.snd?'checked':''}> Sonidos suaves en los botones y al finalizar una venta</label></div>
 <div class="card"><h3>Recordatorios de más vendidos</h3><p>Mensajes emergentes al abrir el sistema.</p><label class="chk"><input type="checkbox" id="c-remD" ${CFG.remD?'checked':''}> Diario (resumen de ayer)</label><label class="chk" style="margin-top:0"><input type="checkbox" id="c-remW" ${CFG.remW?'checked':''}> Semanal (semana pasada)</label><label class="chk" style="margin-top:0"><input type="checkbox" id="c-remM" ${CFG.remM?'checked':''}> Mensual (mes pasado)</label></div>
 <div class="card"><h3>Seguridad y datos</h3><p>La contraseña de tu cuenta protege Reportes y Configuración.</p><div class="act" style="justify-content:flex-start;flex-wrap:wrap;margin-top:16px"><button class="ghost" onclick="pwForm()">Cambiar contraseña</button><button class="ghost" id="wipe" onclick="wipe()">Borrar ventas y facturas</button></div></div>
 </div>`;
}
function saveCfg(){
 const n=id=>Math.max(0,parseFloat($('#c-'+id).value)||0),nm=$('#c-name').value.trim();
 if(!nm)return toast('Ingresá el nombre del negocio',1);
 CFG={name:nm,addr:$('#c-addr').value.trim(),cuit:$('#c-cuit').value.trim(),tel:$('#c-tel').value.trim(),foot:$('#c-foot').value.trim(),rQr:n('rQr'),rDeb:n('rDeb'),r1:n('r1'),r3:n('r3'),r6:n('r6'),r12:n('r12'),low:Math.round(n('low')),inv:$('#c-inv').checked,remD:$('#c-remD').checked,remW:$('#c-remW').checked,remM:$('#c-remM').checked,snd:$('#c-snd').checked};
 sv('sv_c',CFG);render();toast('Configuración guardada')}
function wipe(){const b=$('#wipe');if(b.dataset.s!=='1'){b.dataset.s='1';b.textContent='¿Seguro? Tocá de nuevo';return}S=[];sv('sv_s',S);toast('Historial de ventas borrado');renderCfg()}
function render(){view==='scan'?renderScan():view==='prod'?renderProd():view==='cfg'?renderCfg():view==='fac'?renderFac():renderRep();$('#sn').textContent=CFG.name}
function tick(){const d=new Date();$('#hm').textContent=d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',hour12:false});$('#dt').textContent=d.toLocaleDateString('es-AR',{day:'numeric',month:'short',year:'numeric'})}
/* ---- Sonidos suaves ---- */
let AC=null;
function snd(t){
 if(!CFG.snd)return;
 try{
  AC=AC||new(window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended')AC.resume();
  const n=AC.currentTime,note=(f,at,d,v,ty)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ty||'sine';o.frequency.setValueAtTime(f,n+at);g.gain.setValueAtTime(0.0001,n+at);g.gain.exponentialRampToValueAtTime(v,n+at+0.02);g.gain.exponentialRampToValueAtTime(0.0001,n+at+d);o.connect(g);g.connect(AC.destination);o.start(n+at);o.stop(n+at+d+0.05)};
  if(t==='ok'){[523.25,659.25,783.99,1046.5].forEach((f,i)=>note(f,i*0.11,0.32,0.07,'triangle'));note(1568,0.44,0.5,0.03)}
  else note(620,0,0.11,0.025);
 }catch(e){}
}
document.addEventListener('click',e=>{if(e.target.closest('#conf'))return;if(e.target.closest('button,summary,.sg-i,.row[onclick]'))snd()},true);

/* ---- Cuentas (guardadas en esta PC) ---- */
const A=h=>{$('#auth').style.display='flex';$('#auth').innerHTML=`<div class="card"><h2 style="font-size:26px">Stock Visión</h2>${h}</div>`};
function startAuth(){const u=lsg('sv_session'),d=u&&lsg(ukey(u));if(d&&d.hash){DB=d;boot()}else loginUI()}
function loginUI(m='',reg){
 const f=reg?'doReg()':'doLogin()';
 A(`<p>${reg?'Tu stock, ventas y ganancias se guardan en esta cuenta.':'Ingresá con tu usuario y contraseña.'}</p><input id="l-u" type="text" placeholder="Usuario" value="${esc(lsg('sv_last')||'')}" autocomplete="username"><input id="l-p" type="password" placeholder="Contraseña" autocomplete="${reg?'new-password':'current-password'}" onkeydown="if(event.key==='Enter')${f}">${reg?'<input id="l-p2" type="password" placeholder="Repetir contraseña"><label class="chk"><input type="checkbox" id="l-d"> Cargar productos de ejemplo</label>':''}<div class="err" id="le">${m}</div><div class="ax"><button class="btn" onclick="${f}">${reg?'Crear cuenta':'Ingresar'}</button><button class="ghost" onclick="loginUI('',${!reg})">${reg?'Ya tengo cuenta':'Crear cuenta'}</button></div>`);
 ($('#l-u').value?$('#l-p'):$('#l-u')).focus()}
async function doLogin(){
 const u=$('#l-u').value.trim(),p=$('#l-p').value,e=m=>$('#le').textContent=m;
 if(!u||!p)return e('Completá usuario y contraseña.');
 const d=lsg(ukey(u));
 if(!d||!d.hash)return e('Ese usuario no existe. Podés crear la cuenta.');
 e('Ingresando…');
 if(await hash(p,d.salt)!==d.hash)return e('Contraseña incorrecta.');
 DB=d;lss('sv_last',u);lss('sv_session',u);boot()}
async function doReg(){
 const u=$('#l-u').value.trim(),p=$('#l-p').value,e=m=>$('#le').textContent=m;
 if(!/^[A-Za-z0-9_.-]{3,30}$/.test(u))return e('Usuario: de 3 a 30 letras, números, punto, guion o guion bajo.');
 if(p.length<6)return e('La contraseña debe tener al menos 6 caracteres.');
 if(p!==$('#l-p2').value)return e('Las contraseñas no coinciden.');
 if(lsg(ukey(u)))return e('Ese usuario ya existe.');
 const salt=newSalt();
 DB={v:1,user:u,salt,hash:await hash(p,salt),sv_p:$('#l-d').checked?SEED.map(x=>({...x})):[],sv_s:[],sv_c:{}};
 lss(ukey(u),DB);lss('sv_last',u);lss('sv_session',u);boot()}
function boot(){P=DB.sv_p||[];S=DB.sv_s||[];SEC=[...new Set([...(DB.sv_sec||[]),...P.map(secOf).filter(x=>x!==SIN)])];if(!DB.sv_sec)sv('sv_sec',SEC);CFG={...DEF,...(DB.sv_c||{})};cart=[];recent=[];unlocked=false;fsel.clear();fopen.clear();$('#auth').style.display='none';$('#us').textContent=DB.user;go('scan');checkRem()}
function logout(){closeModal();$('#rem').innerHTML='';lss('sv_session',null);DB={};loginUI()}
tick();setInterval(tick,15000);setInterval(checkRem,300000);startAuth();
</script></body></html>
