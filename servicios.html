};

const P = new URLSearchParams(location.search);
const c = JSON.parse(S.g('cw_cliente') || P.get('c') || 'null');
if (c && c.tipo === 'moto') document.getElementById('hero').src = HERO_MOTO;
if (!c) document.getElementById('hola').innerHTML = 'Primero completá tus datos en el <a href="index.html" style="color:#ffd400">inicio</a>.';
else {
  document.getElementById('hola').textContent = 'Hola ' + c.nombre + ' · ' + (c.tipo === 'moto' ? '🏍️' : '🚗') + ' ' + c.modelo + ' · Elegí tu servicio';
  const lista = document.getElementById('lista');
  SERVICIOS[c.tipo].forEach(s => {
    const b = document.createElement('button');
    if (s.img) {
      b.className = 'pic';
      b.innerHTML = '<img src="' + s.img + '" alt="' + s.nombre + ' $' + s.precio.toLocaleString('es-AR') + '">';
    } else {
      b.className = 'card';
      b.innerHTML = '<h2>' + s.nombre + '</h2><p>' + s.desc + '</p><span class="precio">$' + s.precio.toLocaleString('es-AR') + '</span>';
    }
    b.onclick = () => {
      S.s('cw_servicio', JSON.stringify(s));
      location.href = 'turno.html?c=' + encodeURIComponent(JSON.stringify(c)) + '&s=' + encodeURIComponent(JSON.stringify(s));
    };
    lista.appendChild(b);
  });
}
